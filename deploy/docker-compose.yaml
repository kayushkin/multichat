version: '3.8'

services:
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: synapse
    restart: unless-stopped
    ports:
      - "8008:8008"
    volumes:
      - synapse_data:/data
      - ./synapse:/data/config
    environment:
      - SYNAPSE_SERVER_NAME=chat.kayushkin.com
      - SYNAPSE_REPORT_STATS=no
    networks:
      - matrix_net

  mautrix-telegram:
    image: dock.mau.dev/mautrix/telegram:latest
    container_name: mautrix-telegram
    restart: unless-stopped
    volumes:
      - telegram_data:/data
      - ./mautrix-telegram:/data/config
    depends_on:
      - synapse
    networks:
      - matrix_net

  mautrix-whatsapp:
    image: dock.mau.dev/mautrix/whatsapp:latest
    container_name: mautrix-whatsapp
    restart: unless-stopped
    volumes:
      - whatsapp_data:/data
      - ./mautrix-whatsapp:/data/config
    depends_on:
      - synapse
    networks:
      - matrix_net

volumes:
  synapse_data:
  telegram_data:
  whatsapp_data:

networks:
  matrix_net:
    driver: bridge