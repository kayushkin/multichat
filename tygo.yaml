# TypeScript types generated from multichat's Go wire types. The Go structs
# are the source of truth; ts/ is a render of them. Regenerate with
# ./generate-ts.sh after changing a wire type. Only the inbound-rule records
# are rendered: they are what another UI (bridge-ui's Inbound rules page)
# reads. multichat's own frontend keeps its own types.
packages:
  - path: "github.com/kayushkin/multichat/internal/db"
    output_path: "ts/inbound.ts"
    type_mappings:
      "time.Time": "string"
    include_files:
      - "inbound.go"
